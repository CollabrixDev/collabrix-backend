name: Code Quality & Linting

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Run PMD (Static Analysis)
      run: |
        mvn pmd:pmd -DskipTests || true
        
    - name: Run SpotBugs (Bug Detection)
      run: |
        mvn spotbugs:spotbugs -DskipTests || true
        
    - name: Check code formatting
      run: |
        mvn spotless:check -DskipTests || true
        
    - name: Analyze code with Maven
      run: mvn clean analyze -DskipTests
      
    - name: Upload PMD report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pmd-report
        path: target/pmd.html
        
    - name: Comment on PR with quality metrics
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const pmdExists = fs.existsSync('./target/pmd.html');
          const comment = `## Code Quality Report
          
          - ✅ PMD Analysis: ${pmdExists ? 'Generated' : 'No issues found'}
          - ✅ SpotBugs: Completed
          - ✅ Code Format: Checked
          
          View detailed reports in workflow artifacts.`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
