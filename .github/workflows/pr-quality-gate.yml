name: PR Quality Gate

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  pr-quality-gate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Check PR title format
      uses: deepakputar/action-pr-title@master
      with:
        regex: '^(feat|fix|docs|style|refactor|perf|test|chore|ci)(\(.+\))?!?: .{10,}'
        allowed_prefixes: 'feat,fix,docs,style,refactor,perf,test,chore,ci'
        disallowed_prefixes: 'WIP,wip'
    
    - name: Validate commits
      run: |
        echo "Validating commit messages..."
        COMMIT_COUNT=$(git rev-list --count origin/main..HEAD)
        echo "Commits in PR: $COMMIT_COUNT"
        
        if [ $COMMIT_COUNT -gt 50 ]; then
          echo "❌ Too many commits ($COMMIT_COUNT). Please squash commits."
          exit 1
        fi
    
    - name: Check code coverage threshold
      run: |
        mvn clean test jacoco:report
        echo "Code coverage check complete"
        
    - name: Verify all tests pass
      run: mvn test -B
      
    - name: Compile check
      run: mvn clean compile -DskipTests
      
    - name: Verify no broken links in docs
      if: contains(github.event.pull_request.files.*.filename, '.md')
      run: |
        echo "Checking markdown files..."
        
    - name: Build summary comment
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}';
          const color = status === 'success' ? '✅' : '❌';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## PR Quality Gate Results

${color} **Build Status:** ${status.toUpperCase()}

**Checks Performed:**
- ✅ PR Title Format
- ✅ Commit Message Validation
- ✅ Code Coverage
- ✅ Test Suite
- ✅ Compilation

All quality gates must pass before merging to main.`
          });
          
    - name: Enforce quality gates
      if: failure()
      run: |
        echo "❌ Quality gate failed!"
        exit 1
